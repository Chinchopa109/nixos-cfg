{		
    match = "class_g = 'dmenu'";		
    animations = (		
    {		
        triggers = ["close", "hide"];		
        opacity = {            
                    curve = "cubic-bezier(0.22,1,0.36,1)";
                    duration = 0.2;
                    start = 1;
                    end = 0;
                };
                blur-opacity = "opacity";
                shadow-opacity = "opacity";

                offset-x = {
                    curve = "cubic-bezier(0.22,1,0.36,1)";
                    duration = 0.6;
                    start = 0;
                    end = 0;
                };
                offset-y = {
                    curve = "cubic-bezier(0.22,1,0.36,1)";
                    duration = 0.6;
                    start = -30;
                    end = 120;
                };

                shadow-offset-x = "offset-x";
                shadow-offset-y = "offset-y";

    },		
    {		
        triggers = ["open", "show"];		
		opacity = {
                    curve = "cubic-bezier(0.22,1,0.36,1)";
                    duration = 0.6;
                    start = 0;
                    end = 1;
                };
                blur-opacity = "opacity";
                shadow-opacity = "opacity";

                offset-x = {
                    curve = "cubic-bezier(0.22,1.3,0.36,1)";
                    duration = 0.6;
                    start = 0;
                    end = 0;
                };
                offset-y = {
                    curve = "cubic-bezier(0.22,1.3,0.36,1)";
                    duration = 0.6;
                    start = 50;
                    end = 0;
                };

                shadow-offset-x = "offset-x";
                shadow-offset-y = "offset-y";

    }		
    )		
},
