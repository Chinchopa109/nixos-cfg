{		
    match = "name = 'xlnd'";		
    animations = (		
    {		
        triggers = ["close", "hide"];		
        opacity = {            
                    curve = "cubic-bezier(0.22,1.2,0.36,1)";
                    duration = 0.4;
                    start = 0.5;
                    end = 0;
                };
                blur-opacity = "opacity";
                shadow-opacity = "opacity";

                offset-x = {
                    curve = "cubic-bezier(0.22,2,0.36,1)";
                    duration = 0.4;
                    start = 0;
                    end = -10;
                };
                offset-y = {
                    curve = "cubic-bezier(0.22,2,0.36,1)";
                    duration = 0.4;
                    start = 0;
                    end = -10;
                };

                shadow-offset-x = "offset-x";
                shadow-offset-y = "offset-y";
	
    },		
    {		
        triggers = ["open", "show"];		
		opacity = {
                    curve = "cubic-bezier(0.22,1.2,0.36,1)";
                    duration = 0.4;
                    start = 0.5;
                    end = 1;
                };
                blur-opacity = "opacity";
                shadow-opacity = "opacity";

                offset-x = {
                    curve = "cubic-bezier(0.22,2,0.36,1)";
                    duration = 0.4;
                    start = -10;
                    end = 0;
                };
                offset-y = {
                    curve = "cubic-bezier(0.22,2,0.36,1)";
                    duration = 0.4;
                    start = -10;
                    end = 0;
                };

                shadow-offset-x = "offset-x";
                shadow-offset-y = "offset-y";
	
    }		
    )		
},

