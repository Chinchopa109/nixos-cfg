shadow-color = "#000000"
# shadow-color = "#2b1c34"
# shadow-color = "#3a405a"
# shadow-color = "#7d4f50"
# shadow-color = "#782a2a"
# shadow-color = "#000000"
# shadow-color = "#160c13"
# shadow-color = "#8e8e8e"
# shadow-color = "#ffffff"

fading = true;

fade-in-step = 0.5;
fade-out-step = 1;
fade-delta = 10;
# no-fading-openclose = false
# no-fading-destroyed-argb = false

corner-radius = 0
# shadow-ignore-shaped = false;
backend = "egl";
vsync = true;

unredir-if-possible = false;

use-damage = true;

detect-client-opacity = true;
detect-rounded-corners = true;
blur: {
  method = "dual_kawase";
  strength = 10;
  background = true;
  background-frame = false;
  background-fixed = true;
  kern = "3x3box";
}
rules: (

	# {
		# blur-background = false;
		# fade = true;
	# },


  {
		match = "fullscreen";
		corner-radius = 0;
	},

	{
		# match = "window_type = 'dock'";
		# corner-radius = 0;
		# fade = true;
	},
  {
		match = "class_g = 'dmenu'";
		corner-radius = 0;
	},
  {
    # match = "class_g = 'Polybar'";
    # blur-background = false;
    # shadow = false;
	},
	{
		match = "window_type = 'dropdown_menu' || window_type = 'menu' || window_type = 'popup' || window_type = 'popup_menu' || window_type = 'utility'";
		corner-radius = 0;
    blur-background = false;
    shadow = false;
	},
    {
        # Fix shadow related bugs on small UI elements
        match = "window_type = 'menu' || role = 'popup' || role = 'bubble'";
        shadow = false;
        blur-background = false;
    },

	{
		match = "class_g = 'vxwm'";
		corner-radius = 0;
    	# blur-background = false;
    	shadow = false;
	},
	{
		match = "class_g = 'dmenu'";
		shadow = false;
	},
  {
		# match = "name = 'xlnd'";
		# shadow = false;
    # animations = ({});
	},
  {
		match = "class_g = 'XEyes'";
    shadow = false;
	},


